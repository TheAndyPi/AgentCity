<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Generated scene geometry QA</title>
  </head>
  <body>
    <div id="scene" style="max-width: 760px; margin: 40px auto"></div>
    <script type="module">
      import React from "react";
      import { createRoot } from "react-dom/client";
      import { ScenarioDiorama } from "../../src/world/ScenarioScene.tsx";
      import "../../src/styles.css";
      const part = (shape, offset, size, color) => ({
        shape,
        offset,
        size,
        color,
      });
      const xyz = (x, y, z) => ({ x, y, z });
      // Representative structured-provider geometry, with every permitted primitive.
      const whale = {
        model: "generated",
        label: "Whale",
        position: { x: 33, y: 33 },
        scale: 1,
        rotation: 0,
        color: "#8bb9db",
        parts: [
          part("sphere", xyz(0, 1.2, 0), xyz(4, 2, 2), "#8bb9db"),
          part("sphere", xyz(1.6, 1.4, 0), xyz(1.8, 1.7, 1.8), "#8bb9db"),
          part("box", xyz(-2.1, 0.9, 0), xyz(1.3, 0.35, 2.6), "#699ec9"),
          part("cylinder", xyz(1, 2.8, 0), xyz(0.2, 1.5, 0.2), "#d1edf0"),
          part("cone", xyz(1, 3.5, 0), xyz(1.2, 0.8, 1.2), "#d1edf0"),
          part("sphere", xyz(2.1, 1.6, 0.68), xyz(0.16, 0.16, 0.16), "#35424b"),
        ],
      };
      createRoot(document.getElementById("scene")).render(
        React.createElement(ScenarioDiorama, { objects: [whale] }),
      );
    </script>
  </body>
</html>
