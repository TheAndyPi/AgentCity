[project]
name = "agentcity-backend"
version = "1.0.0"
requires-python = ">=3.13"
dependencies = ["fastapi", "uvicorn", "httpx", "websockets", "google-auth[requests]", "psycopg[binary]==3.3.3"]

[project.optional-dependencies]
dev = ["pytest", "httpx2", "jsonschema", "pyyaml", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
ignore = ["UP046"]
