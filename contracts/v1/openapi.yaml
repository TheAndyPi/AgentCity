        label:
          type: string
          maxLength: 80
          minLength: 1
          pattern: ^\S(?:[\s\S]*\S)?$
          title: Label
        position:
          $ref: '#/components/schemas/Vec2'
        scale:
          type: number
          maximum: 4.0
          minimum: 0.5
          title: Scale
        rotation:
          type: number
          maximum: 6.284
          minimum: 0.0
          title: Rotation
        color:
          type: string
          pattern: ^#[0-9a-fA-F]{6}$
          title: Color
        parts:
          items:
            $ref: '#/components/schemas/ScenePart'
          type: array
          maxItems: 8
          title: Parts
      additionalProperties: false
      type: object
      required:
      - model
      - label
      - position
      - scale
      - rotation
      - color
      title: SceneObject
      description: 'Bounded procedural props: no external assets or executable model
        output.'
    SceneOffset:
      properties:
        x:
          type: number
          maximum: 8.0
          minimum: -8.0
          title: X
        y:
          type: number
          maximum: 10.0
          minimum: 0.0
          title: Y
        z:
          type: number
          maximum: 8.0
          minimum: -8.0
          title: Z
      additionalProperties: false
      type: object
      required:
      - x
      - y
      - z
      title: SceneOffset
