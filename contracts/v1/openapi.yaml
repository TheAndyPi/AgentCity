          title: Name
        source:
          oneOf:
          - $ref: '#/components/schemas/WholeSource'
          - $ref: '#/components/schemas/RevisionSource'
          - $ref: '#/components/schemas/SnapshotSource'
          title: Source
          discriminator:
            propertyName: kind
            mapping:
              revision: '#/components/schemas/RevisionSource'
              snapshot: '#/components/schemas/SnapshotSource'
              whole: '#/components/schemas/WholeSource'
      additionalProperties: false
      type: object
      required:
      - name
      - source
      title: BranchRequest
    BranchResult:
      properties:
        simulation:
          $ref: '#/components/schemas/Simulation'
        snapshot:
          $ref: '#/components/schemas/Snapshot'
      additionalProperties: false
      type: object
      required:
      - simulation
      - snapshot
      title: BranchResult
    Building:
      properties:
        id:
          type: string
          maxLength: 200
          minLength: 1
          title: Id
        name:
          type: string
          maxLength: 80
          minLength: 1
          pattern: ^\S(?:[\s\S]*\S)?$
          title: Name
        kind:
          type: string
          enum:
          - home
          - work
          - shop
          - shelter
          - hospital
          - community
          title: Kind
        footprint:
          items:
            $ref: '#/components/schemas/Vec2'
          type: array
          minItems: 3
          title: Footprint
        entrance:
          $ref: '#/components/schemas/Vec2'
        height_m:
          type: number
          minimum: 0.0
          title: Height M
        capacity:
          type: integer
          maximum: 9007199254740991.0
          minimum: 0.0
          title: Capacity
        occupancy:
          type: integer
          maximum: 9007199254740991.0
          minimum: 0.0
          title: Occupancy
        functional:
          type: boolean
          title: Functional
      additionalProperties: false
      type: object
      required:
      - id
      - name
      - kind
      - footprint
      - entrance
      - height_m
      - capacity
      - occupancy
      - functional
      title: Building
    Capabilities:
      properties:
        contract_version:
          type: string
          const: 1.0.0
          title: Contract Version
        auth_mode:
          type: string
          enum:
          - local
          - session
          title: Auth Mode
        max_agents:
          type: integer
          maximum: 9007199254740991.0
          minimum: 0.0
          title: Max Agents
        max_concurrent_running_simulations:
          type: integer
          maximum: 9007199254740991.0
          minimum: 0.0
          title: Max Concurrent Running Simulations
        gemini:
          type: boolean
          title: Gemini
        narration:
          type: boolean
          title: Narration
        snowflake:
          type: boolean
          title: Snowflake
        persistence:
          type: string
          enum:
          - local
          - postgres
          title: Persistence
        replay:
          type: boolean
          title: Replay
        branching:
          type: boolean
          title: Branching
      additionalProperties: false
      type: object
      required:
      - contract_version
      - auth_mode
      - max_agents
      - max_concurrent_running_simulations
      - gemini
      - narration
      - snowflake
      - persistence
      - replay
      - branching
      title: Capabilities
    Cell:
      properties:
        col:
          type: integer
          maximum: 9007199254740991.0
          minimum: 0.0
          title: Col
        row:
          type: integer
          maximum: 9007199254740991.0
          minimum: 0.0
          title: Row
        elevation_m:
          type: number
          title: Elevation M
        terrain:
          type: string
          enum:
          - land
          - road
          - water
          title: Terrain
        walkable:
          type: boolean
          title: Walkable
        zone_id:
