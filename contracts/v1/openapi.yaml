components:
  schemas:
    Acknowledge:
      properties:
        type:
          type: string
          const: acknowledge_outcome
          title: Type
        event_id:
          type: string
          maxLength: 200
          minLength: 1
          title: Event Id
        resume:
          type: boolean
          title: Resume
      additionalProperties: false
      type: object
      required:
      - type
      - event_id
      - resume
      title: Acknowledge
    AddAgents:
      properties:
        type:
          type: string
          const: add_agents
          title: Type
        custom_agent_ids:
          items:
            type: string
            maxLength: 200
            minLength: 1
          type: array
          maxItems: 100
          minItems: 1
          uniqueItems: true
          title: Custom Agent Ids
      additionalProperties: false
      type: object
      required:
      - type
      - custom_agent_ids
      title: AddAgents
    AgentDetail:
      properties:
        ref:
          $ref: '#/components/schemas/Ref'
        agent:
          $ref: '#/components/schemas/AgentSummary'
        profile:
          $ref: '#/components/schemas/Profile'
        home:
          $ref: '#/components/schemas/Vec2'
        needs:
          $ref: '#/components/schemas/Needs'
        inventory:
          $ref: '#/components/schemas/Inventory'
        reputation:
          type: number
          maximum: 100.0
          minimum: 0.0
          title: Reputation
        beliefs:
          items:
            $ref: '#/components/schemas/Belief'
          type: array
          title: Beliefs
        goals:
          items:
            type: string
            maxLength: 2000
          type: array
          title: Goals
        memories:
          $ref: '#/components/schemas/Page_Memory_'
        relationships:
          $ref: '#/components/schemas/Page_Relationship_'
        decisions:
          $ref: '#/components/schemas/Page_Decision_'
        major_event_ids:
          items:
            type: string
            maxLength: 200
            minLength: 1
          type: array
          title: Major Event Ids
        metric_reasons:
          items:
            $ref: '#/components/schemas/MetricReason'
          type: array
          title: Metric Reasons
      additionalProperties: false
      type: object
      required:
      - ref
      - agent
      - profile
      - home
      - needs
      - inventory
      - reputation
      - beliefs
      - goals
      - memories
      - relationships
      - decisions
      - major_event_ids
      - metric_reasons
      title: AgentDetail
    AgentSummary:
      properties:
        id:
          type: string
          maxLength: 200
          minLength: 1
          title: Id
        name:
          type: string
          maxLength: 80
          minLength: 1
          pattern: ^\S(?:[\s\S]*\S)?$
          title: Name
        role:
          type: string
          maxLength: 80
          minLength: 1
          pattern: ^\S(?:[\s\S]*\S)?$
          title: Role
        position:
          $ref: '#/components/schemas/Vec2'
        heading_rad:
          type: number
          title: Heading Rad
        path:
          items:
            $ref: '#/components/schemas/Vec2'
          type: array
          title: Path
        movement_speed_mps:
          type: number
          minimum: 0.0
          title: Movement Speed Mps
        metrics:
          $ref: '#/components/schemas/Metrics'
        emotion:
          type: string
          maxLength: 2000
          title: Emotion
        action:
          type: string
          enum:
          - idle
          - move
          - work
          - rest
          - consume
          - gather
          - talk
          - warn
          - help
          - trade
          - evacuate
          title: Action
        action_target_id:
          anyOf:
          - type: string
            maxLength: 200
            minLength: 1
          - type: 'null'
          title: Action Target Id
        latest_decision_id:
          anyOf:
          - type: string
            maxLength: 200
            minLength: 1
          - type: 'null'
          title: Latest Decision Id
        thought_bubble:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
          title: Thought Bubble
        active:
          type: boolean
          title: Active
      additionalProperties: false
      type: object
      required:
      - id
      - name
      - role
      - position
      - heading_rad
      - path
      - movement_speed_mps
      - metrics
      - emotion
      - action
      - action_target_id
      - latest_decision_id
      - thought_bubble
      - active
      title: AgentSummary
    Archive:
      properties:
        type:
          type: string
          const: archive
          title: Type
      additionalProperties: false
      type: object
      required:
      - type
      title: Archive
    Belief:
      properties:
        text:
          type: string
          maxLength: 2000
          title: Text
        confidence:
          type: number
          maximum: 100.0
          minimum: 0.0
          title: Confidence
        evidence:
          $ref: '#/components/schemas/Evidence'
      additionalProperties: false
      type: object
      required:
      - text
      - confidence
      - evidence
      title: Belief
    BranchRequest:
      properties:
        name:
          type: string
          maxLength: 80
          minLength: 1
